# =========================================================================
# NEROAI & CODEBOT - PRODUCTION NGINX CONFIGURATION
# Domain: nerotechnology.online
# Host: Oracle Cloud Infrastructure (1 CPU / Always Free)
# Frontend: Static SPA build (/var/www/codebot/apps/frontend/dist)
# Backend: Native FastAPI running on port 8080
# =========================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name nerotechnology.online www.nerotechnology.online;

    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nerotechnology.online www.nerotechnology.online;

    # SSL Certificates (managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/nerotechnology.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nerotechnology.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend Static Files (SPA)
    root /var/www/codebot/apps/frontend/dist;
    index index.html;

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API Proxy to Native FastAPI Backend on Port 8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / Streaming AI responses & WebSockets
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # SPA Fallback: Any non-file route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
